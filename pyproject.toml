[project]
name = "aqequiv"
version = "0.5.1"
description = "Equivalence testing and sensor classification for ambient air quality measurements"
readme = "README.md"
authors = [
    { name = "Petar Krešimir Borić", email = "112004618+pboric@users.noreply.github.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["air quality", "particulate matter", "equivalence", "low-cost sensors", "measurement uncertainty", "orthogonal regression"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.scripts]
aqequiv = "aqequiv.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
